<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#5b42f3">
  <title>Connect Plus Primary 4 - Term 1 | Mr.Farid Learning Portal</title>
  <link rel="stylesheet" href="styles.css?v=20260716-header-support-4">
</head>
<body data-app-build="20260716-portal-1">
  <section id="app" class="app">
    <header class="topbar">
      <div class="brand">
        <button id="menuBtn" class="mobile-menu" aria-label="Open course menu">☰</button>
        <span class="brand-badge">C+</span>
        <span>CONNECT PLUS PRIMARY 4</span>
      </div>
      <div class="stat-strip" aria-label="Learning rewards">
        <div class="stat"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="m13 2-9 12h7l-1 8 10-13h-7V2Z"/></svg><span id="xpStat">0</span> XP</div>
        <div class="stat"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><circle cx="12" cy="12" r="9"/><path d="M9 9h6M9 12h6M9 15h6"/></svg><span id="coinStat">0</span></div>
        <div class="stat"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="m12 2 3 6 7 .9-5 4.8 1.3 6.8L12 17l-6.3 3.5L7 13.7 2 9l7-.9 3-6Z"/></svg><span id="starStat">0</span></div>
      </div>
      <div class="teacher-area">
        <span id="cloudStatus" class="cloud-status local"><i></i><b>Progress saved on this device</b></span>
        <a id="mrFaridSupport" href="https://wa.me/966552019074" target="_blank" rel="noreferrer" aria-label="Contact Mr.Farid on WhatsApp for technical support" title="Technical support on WhatsApp"><svg viewBox="0 0 32 32" width="20" height="20" fill="currentColor" aria-hidden="true"><path d="M16 4a11.5 11.5 0 0 0-9.8 17.5L4.7 27l5.7-1.5A11.6 11.6 0 1 0 16 4Zm0 20.8c-1.8 0-3.5-.5-5-1.4l-.4-.2-3.3.9.9-3.2-.2-.4A9.1 9.1 0 1 1 16 24.8Zm5-6.8c-.3-.1-1.7-.8-2-.9-.3-.1-.5-.1-.7.2l-.9 1.1c-.2.2-.3.2-.6.1a7.5 7.5 0 0 1-3.7-3.2c-.3-.5.3-.5.8-1.5.1-.2 0-.4 0-.6l-.9-2.1c-.2-.5-.5-.5-.7-.5h-.6c-.2 0-.6.1-.9.4-.3.4-1.2 1.2-1.2 2.9s1.2 3.3 1.4 3.5c.1.2 2.4 3.7 5.9 5.2 2.2.9 3 .9 4.1.7.7-.1 1.7-.7 1.9-1.4.2-.7.2-1.3.1-1.4-.2-.3-.4-.4-.7-.5Z"/></svg><span>Support</span></a>
        <button id="courseSwitchBtn" class="course-switch-btn" title="Choose another curriculum">← CURRICULA</button>
        <button id="portalHomeBtn" class="course-switch-btn portal-home-btn" title="Return to portal home">⌂ PORTAL HOME</button>
      </div>
    </header>
    <div class="layout"><aside id="sidebar" class="sidebar"></aside><main id="main" class="main"></main></div>
  </section>

  <div id="confirmModal" class="modal hidden">
    <div class="modal-card" style="max-width:470px">
      <button class="close-modal" data-close="confirmModal" aria-label="Close">×</button>
      <h2>Reset your progress?</h2>
      <p class="lead">This removes the saved answers, XP, coins, badges, and last position for this course from this device. All units and lessons will remain open.</p>
      <div style="display:flex;gap:10px"><button id="cancelReset" class="ghost-btn" style="flex:1">Cancel</button><button id="confirmReset" class="primary-btn" style="flex:1;background:var(--danger)">Reset</button></div>
    </div>
  </div>
  <div id="toast" class="toast"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../portal-progress.js?v=20260716-auth-3"></script>
  <script src="app.js?v=20260716-auth-4" defer></script>
</body>
</html>
