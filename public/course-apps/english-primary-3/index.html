<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7faff">
  <meta name="description" content="English Primary 3 – Term 1 interactive learning website with lessons, flashcards, grammar, reading and challenges.">
  <title>English Primary 3 – Term 1</title>
  <link rel="icon" href="assets/images/icon-192.png">
