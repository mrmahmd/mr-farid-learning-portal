<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#1769e0" />
  <meta name="description" content="Interactive English Primary 2 - Term 1 learning platform." />
  <title>English Primary 2 - Term 1 | Mr.Mohamed Farid</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="assets/images/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="app"></div>
  <noscript>This website needs JavaScript to run.</noscript>
  <script src="js/data.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/portal-progress.js"></script>
  <script src="js/app.js"></script>
  <script>
    window.addEventListener('DOMContentLoaded', () => {
      window.MrFaridCourseProgress?.connect({
        courseId: 'english-primary-2-first-term',
        getState: () => window.Primary2Store?.getState?.() || {},
        setState: (next) => window.Primary2Store?.replaceState?.(next),
        mergeState: (current, remote) => ({
          ...current,
          ...remote,
          lessons: { ...(current.lessons || {}), ...(remote.lessons || {}) },
          reviews: { ...(current.reviews || {}), ...(remote.reviews || {}) },
        }),
        onStatus: ({ online, message }) => window.Primary2Store?.setSyncStatus?.(online, message),
      });
    });
  </script>
</body>
</html>
