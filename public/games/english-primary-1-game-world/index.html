<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#1769e8">
  <meta name="description" content="English Primary 1 Game World – interactive educational games for Term 1.">
  <title>English Primary 1 – Game World</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/images/icon-192.png">
  <link rel="stylesheet" href="css/game-world.css">
</head>
<body>
  <noscript>This website needs JavaScript to run the educational games.</noscript>
  <div id="app" aria-live="polite"></div>
  <script src="js/curriculum.js"></script>
  <script src="js/question-engine.js"></script>
  <script src="js/game-data.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/portal-progress.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/engines.js"></script>
  <script src="js/app.js"></script>
  <script>
    window.addEventListener('DOMContentLoaded', () => {
      window.MrFaridCourseProgress?.connect({
        courseId: 'english-primary-1-games',
        getState: () => window.GameStorage.getState(),
        setState: (next) => window.GameStorage.replaceState(next),
        mergeState: (current, remote) => window.GameStorage.mergeState(current, remote),
      });
    });
    if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
      window.addEventListener('load', () => navigator.serviceWorker.register('./service-worker.js').catch(() => {}));
    }
  </script>
</body>
</html>
