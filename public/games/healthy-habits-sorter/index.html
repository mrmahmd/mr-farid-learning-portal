<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Healthy Habits Sorter | Unit 1 Lesson 1</title>
    <style>
        :root {
            --healthy: #2ecc71;
            --unhealthy: #e74c3c;
            --dark: #2c3e50;
            --light: #ecf0f1;
        }
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--light); color: var(--dark); margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        
        header { text-align: center; margin-bottom: 20px; }
        h1 { color: var(--dark); font-size: 2.5rem; margin: 0 0 10px 0; }
        
        .score-board { display: flex; gap: 20px; font-size: 1.5rem; font-weight: bold; background: white; padding: 10px 30px; border-radius: 50px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .stars { color: #f1c40f; }

        .game-board { display: flex; width: 100%; max-width: 900px; gap: 20px; margin-top: 20px; }
        
        .zone { flex: 1; border-radius: 15px; padding: 20px; min-height: 400px; display: flex; flex-direction: column; align-items: center; gap: 10px; transition: all 0.3s; }
        .zone h2 { color: white; margin-top: 0; font-size: 2rem; text-shadow: 1px 1px 2px rgba(0,0,0,0.2); }
        
        #healthy-zone { background-color: rgba(46, 204, 113, 0.2); border: 4px dashed var(--healthy); }
        #healthy-zone.drag-over { background-color: rgba(46, 204, 113, 0.4); }
        
        #unhealthy-zone { background-color: rgba(231, 76, 60, 0.2); border: 4px dashed var(--unhealthy); }
        #unhealthy-zone.drag-over { background-color: rgba(231, 76, 60, 0.4); }

        .items-container { display: flex; flex-wrap: wrap; justify-content: center; gap: 15px; max-width: 900px; margin-top: 30px; padding: 20px; background: white; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        
        .item { background: white; padding: 15px 25px; border-radius: 10px; font-size: 1.4rem; font-weight: bold; cursor: grab; box-shadow: 0 4px 6px rgba(0,0,0,0.1); border: 2px solid #bdc3c7; user-select: none; transition: transform 0.2s; }
        .item:active { cursor: grabbing; transform: scale(0.95); }
        
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); align-items: center; justify-content: center; z-index: 100; }
        .modal-content { background: white; padding: 50px; border-radius: 20px; text-align: center; }
        .modal-content h1 { color: var(--healthy); font-size: 3rem; margin-top: 0; }
        .btn { background: var(--dark); color: white; border: none; padding: 15px 40px; font-size: 1.5rem; border-radius: 10px; cursor: pointer; margin-top: 20px; }
        
        @media (max-width: 768px) { .game-board { flex-direction: column; } }
    </style>
</head>
<body>

    <header>
        <a href="../../" style="display:inline-block;margin-bottom:14px;color:#2c3e50;font-weight:700;text-decoration:none">← Back to Games</a>
        <h1>Healthy Habits Sorter</h1>
        <div class="score-board">
            <span>XP: <span id="xp-counter">0</span></span>
            <span class="stars">⭐ <span id="star-counter">0</span></span>
        </div>
    </header>

    <div class="game-board">
        <div class="zone" id="healthy-zone" data-type="healthy">
            <h2>Healthy ✅</h2>
        </div>
        <div class="zone" id="unhealthy-zone" data-type="unhealthy">
            <h2>Unhealthy ❌</h2>
        </div>
    </div>

    <div class="items-container" id="items-container">
        <!-- Items injected by JS -->
    </div>

    <div class="modal" id="victory-modal">
        <div class="modal-content">
            <h1>Outstanding!</h1>
            <p style="font-size: 1.5rem">You know your healthy habits perfectly.</p>
            <button class="btn" onclick="initGame()">Play Again</button>
        </div>
    </div>

    <script>
        const database = [
            { text: "Drink orange juice", type: "healthy" },
            { text: "Sleep for 9 hours", type: "healthy" },
            { text: "Play sports", type: "healthy" },
            { text: "Drink plenty of water", type: "healthy" },
            { text: "Eat lots of vegetables", type: "healthy" },
            { text: "Eat too many sweets", type: "unhealthy" },
            { text: "Sleep very late", type: "unhealthy" },
            { text: "Never drink water", type: "unhealthy" }
        ];

        let xp = 0;
        let stars = 0;
        let correctMatches = 0;
        let draggedItem = null;

        function initGame() {
            xp = 0;
            stars = 0;
            correctMatches = 0;
            updateHUD();
            document.getElementById('victory-modal').style.display = 'none';
            
            // Reset Zones
            document.querySelectorAll('.zone .item').forEach(el => el.remove());
            
            const container = document.getElementById('items-container');
            container.innerHTML = '';
            
            // Shuffle
            const shuffled = [...database].sort(() => Math.random() - 0.5);
            
            shuffled.forEach(item => {
                const el = document.createElement('div');
                el.classList.add('item');
                el.setAttribute('draggable', true);
                el.setAttribute('data-type', item.type);
                el.innerText = item.text;
                
                el.addEventListener('dragstart', function() {
                    draggedItem = this;
                    setTimeout(() => this.style.opacity = '0.5', 0);
                });
                
                el.addEventListener('dragend', function() {
                    draggedItem = null;
                    this.style.opacity = '1';
                });
                
                container.appendChild(el);
            });
        }

        const zones = document.querySelectorAll('.zone');
        
        zones.forEach(zone => {
            zone.addEventListener('dragover', e => {
                e.preventDefault();
                zone.classList.add('drag-over');
            });
            
            zone.addEventListener('dragleave', () => {
                zone.classList.remove('drag-over');
            });
            
            zone.addEventListener('drop', function(e) {
                this.classList.remove('drag-over');
                if (!draggedItem) return;
                
                const expectedType = this.getAttribute('data-type');
                const itemType = draggedItem.getAttribute('data-type');
                
                if (expectedType === itemType) {
                    this.appendChild(draggedItem);
                    draggedItem.setAttribute('draggable', false);
                    draggedItem.style.cursor = 'default';
                    draggedItem.style.borderColor = expectedType === 'healthy' ? 'var(--healthy)' : 'var(--unhealthy)';
                    
                    xp += 100;
                    correctMatches++;
                    if (correctMatches % 2 === 0) stars++;
                    updateHUD();
                    
                    if (correctMatches === database.length) {
                        setTimeout(() => {
                            document.getElementById('victory-modal').style.display = 'flex';
                        }, 500);
                    }
                } else {
                    xp = Math.max(0, xp - 20);
                    updateHUD();
                    draggedItem.style.transform = "translateX(10px)";
                    setTimeout(() => draggedItem.style.transform = "translateX(-10px)", 100);
                    setTimeout(() => draggedItem.style.transform = "translateX(0)", 200);
                }
            });
        });

        function updateHUD() {
            document.getElementById('xp-counter').innerText = xp;
            document.getElementById('star-counter').innerText = stars;
        }

        window.onload = initGame;
    </script>
</body>
</html>
