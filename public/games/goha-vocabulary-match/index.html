<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Goha's Vocabulary Match | Unit 1 Lesson 3</title>
    <style>
        :root {
            --primary: #F39C12;
            --secondary: #2C3E50;
            --light: #ECF0F1;
            --card-bg: #FFFFFF;
        }
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--light); color: var(--secondary); margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; font-size: 1.6rem; }
        
        .hud { display: flex; gap: 30px; font-weight: bold; background: white; padding: 15px 40px; border-radius: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 30px; font-size: 1.8rem; }
        
        .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; max-width: 900px; width: 100%; perspective: 1000px; }
        
        .card { width: 100%; aspect-ratio: 4/3; position: relative; cursor: pointer; transform-style: preserve-3d; transition: transform 0.5s; border-radius: 15px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        .card.flipped { transform: rotateY(180deg); }
        
        .card-face { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; display: flex; align-items: center; justify-content: center; border-radius: 15px; font-weight: bold; text-align: center; padding: 10px; font-size: 2rem; }
        .card-front { background: var(--primary); color: white; font-size: 3rem; }
        .card-back { background: var(--card-bg); color: var(--secondary); transform: rotateY(180deg); border: 3px solid var(--primary); }
        
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); align-items: center; justify-content: center; z-index: 100; }
        .modal-content { background: white; padding: 50px; border-radius: 20px; text-align: center; }
        .btn { background: var(--secondary); color: white; border: none; padding: 20px 40px; font-size: 1.8rem; border-radius: 10px; cursor: pointer; margin-top: 20px; }
        
        @media (max-width: 768px) { .grid { grid-template-columns: repeat(2, 1fr); } }
    </style>
</head>
<body>

    <div class="hud">
        <span>Moves: <span id="moves">0</span></span>
        <span>Matches: <span id="matches">0</span>/5</span>
    </div>

    <div class="grid" id="game-grid"></div>

    <div class="modal" id="victory-modal">
        <div class="modal-content">
            <h1 style="font-size: 3rem; color: var(--primary); margin-top: 0;">Excellent!</h1>
            <p>You matched all the vocabulary words.</p>
            <button class="btn" onclick="initGame()">Play Again</button>
        </div>
    </div>

    <script>
        const cardsArray = [
            { id: 'owner', content: 'Owner' }, { id: 'owner', content: 'Someone who has something' },
            { id: 'greedy', content: 'Greedy' }, { id: 'greedy', content: 'Always wanting more' },
            { id: 'coin', content: 'Coin' }, { id: 'coin', content: 'Metal money' },
            { id: 'jingling', content: 'Jingling' }, { id: 'jingling', content: 'A light ringing sound' },
            { id: 'share', content: 'Share' }, { id: 'share', content: 'Give some to others' }
        ];

        let moves = 0;
        let matches = 0;
        let flippedCards = [];

        function initGame() {
            moves = 0;
            matches = 0;
            updateHUD();
            document.getElementById('victory-modal').style.display = 'none';
            const grid = document.getElementById('game-grid');
            grid.innerHTML = '';

            const shuffled = [...cardsArray].sort(() => Math.random() - 0.5);

            shuffled.forEach((item, index) => {
                const card = document.createElement('div');
                card.classList.add('card');
                card.dataset.id = item.id;
                card.innerHTML = `
                    <div class="card-face card-front">â‌“</div>
                    <div class="card-face card-back">${item.content}</div>
                `;
                card.addEventListener('click', flipCard);
                grid.appendChild(card);
            });
        }

        function flipCard() {
            if (flippedCards.length < 2 && !this.classList.contains('flipped')) {
                this.classList.add('flipped');
                flippedCards.push(this);

                if (flippedCards.length === 2) {
                    moves++;
                    updateHUD();
                    checkMatch();
                }
            }
        }

        function checkMatch() {
            const [card1, card2] = flippedCards;
            const match = card1.dataset.id === card2.dataset.id;

            if (match) {
                matches++;
                updateHUD();
                flippedCards = [];
                if (matches === 5) {
                    setTimeout(() => document.getElementById('victory-modal').style.display = 'flex', 500);
                }
            } else {
                setTimeout(() => {
                    card1.classList.remove('flipped');
                    card2.classList.remove('flipped');
                    flippedCards = [];
                }, 1200);
            }
        }

        function updateHUD() {
            document.getElementById('moves').innerText = moves;
            document.getElementById('matches').innerText = matches;
        }

        window.onload = initGame;
    </script>
</body>
</html>
