<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Pronoun Blaster: Grammar Galaxy</title>
  <desc id="desc">A bright grammar galaxy with a friendly blaster robot, planets and pronoun targets.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e7fbff"/><stop offset=".55" stop-color="#a7e8ff"/><stop offset="1" stop-color="#9be8c7"/></linearGradient>
    <radialGradient id="planet"><stop stop-color="#fff"/><stop offset=".16" stop-color="#75ddff"/><stop offset="1" stop-color="#5b62df"/></radialGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#27548a" flood-opacity=".22"/></filter>
  </defs>
  <rect width="1200" height="620" rx="38" fill="url(#sky)"/>
  <circle cx="975" cy="110" r="82" fill="url(#planet)" filter="url(#shadow)"/>
  <circle cx="1020" cy="300" r="126" fill="#fff" opacity=".22"/>
  <circle cx="170" cy="110" r="12" fill="#fff"/><circle cx="275" cy="208" r="8" fill="#fff"/><circle cx="1080" cy="470" r="10" fill="#fff"/>
  <path d="M0 500 Q280 390 560 500 T1200 470 V620 H0Z" fill="#69d8be" opacity=".55"/>
  <g transform="translate(125 255)" filter="url(#shadow)">
    <rect x="0" y="65" width="180" height="155" rx="38" fill="#33598e"/>
    <rect x="32" y="92" width="116" height="83" rx="24" fill="#dff7ff"/>
    <circle cx="67" cy="132" r="11" fill="#5b62df"/><circle cx="113" cy="132" r="11" fill="#5b62df"/>
    <path d="M66 157 Q90 176 115 157" fill="none" stroke="#38b995" stroke-width="7" stroke-linecap="round"/>
    <path d="M180 118 L285 86 L300 115 L188 153Z" fill="#37bfae"/>
    <circle cx="298" cy="101" r="20" fill="#ffd15b"/>
    <path d="M68 65 V30 M68 30 L52 45 M68 30 L84 45" fill="none" stroke="#33598e" stroke-width="10" stroke-linecap="round"/>
  </g>
  <g transform="translate(710 330)" filter="url(#shadow)">
    <circle r="86" fill="#fff" opacity=".9" stroke="#5b62df" stroke-width="9"/>
    <text x="0" y="20" text-anchor="middle" font-family="Arial,sans-serif" font-size="70" font-weight="900" fill="#5b62df">he</text>
  </g>
  <g transform="translate(930 430)" filter="url(#shadow)">
    <circle r="72" fill="#fff" opacity=".9" stroke="#37bfae" stroke-width="9"/>
    <text x="0" y="20" text-anchor="middle" font-family="Arial,sans-serif" font-size="58" font-weight="900" fill="#168c7d">them</text>
  </g>
  <text x="480" y="90" text-anchor="middle" font-family="Arial,sans-serif" font-size="42" font-weight="900" fill="#12355b">PRONOUN BLASTER</text>
  <text x="480" y="138" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#365b88">GRAMMAR GALAXY</text>
</svg>
